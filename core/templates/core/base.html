<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Maya Fashion Arts{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 16rem;
            --ink: #24212a;
            --muted: #77727e;
            --canvas: #f7f6f8;
            --accent: #764d68;
        }

        body {
            min-height: 100vh;
            background: var(--canvas);
            color: var(--ink);
        }

        .app-header {
            min-height: 4.25rem;
            background: #fff;
            border-bottom: 1px solid #e8e5e9;
        }

        .brand {
            color: var(--ink);
            font-weight: 700;
            letter-spacing: .02em;
            text-decoration: none;
        }

        .menu-toggle {
            display: inline-flex;
            width: 2.5rem;
            height: 2.5rem;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid #e5e1e7;
            border-radius: .5rem;
            background: #fff;
        }

        .menu-toggle span {
            width: 1rem;
            height: 2px;
            border-radius: 2px;
            background: var(--ink);
        }

        .app-layout {
            display: flex;
            min-height: calc(100vh - 4.25rem);
        }

        .app-sidebar {
            width: var(--sidebar-width);
            flex: 0 0 var(--sidebar-width);
            padding: 1.5rem 1rem;
            background: #fff;
            border-right: 1px solid #e8e5e9;
            transition: margin-left .2s ease;
        }

        .sidebar-label {
            padding: 0 .75rem;
            color: var(--muted);
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .sidebar-link {
            display: block;
            margin-top: .35rem;
            padding: .7rem .75rem;
            border-radius: .5rem;
            color: #514b56;
            text-decoration: none;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: #f3edf2;
            color: var(--accent);
        }

        .app-main {
            min-width: 0;
            flex: 1;
            padding: 2rem clamp(1.25rem, 4vw, 3rem);
        }

        .app-shell.sidebar-collapsed .app-sidebar {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .dashboard-canvas {
            min-height: 24rem;
        }

        @media (max-width: 767.98px) {
            .app-sidebar {
                position: absolute;
                z-index: 2;
                min-height: calc(100vh - 4.25rem);
                box-shadow: 0 .5rem 1.5rem rgb(36 33 42 / 8%);
            }

            .app-shell.sidebar-collapsed .app-sidebar {
                margin-left: calc(-1 * var(--sidebar-width));
            }
        }
    </style>
</head>
<body>
    <div class="app-shell" id="app-shell">
        <header class="app-header d-flex align-items-center gap-3 px-3 px-md-4">
            <button
                class="menu-toggle"
                id="sidebar-toggle"
                type="button"
                aria-label="Toggle navigation"
                aria-controls="app-sidebar"
                aria-expanded="true"
            >
                <span></span><span></span><span></span>
            </button>
            <a class="brand" href="{% url 'core:dashboard' %}">Maya Fashion Arts</a>
        </header>

        <div class="app-layout">
            <aside class="app-sidebar" id="app-sidebar" aria-label="Main navigation">
                <div class="sidebar-label">Workspace</div>
                <nav class="mt-2">
                    <a class="sidebar-link {% if request.resolver_match.app_name == 'core' %}active{% endif %}" href="{% url 'core:dashboard' %}">Dashboard</a>
                    {% if request.user.is_authenticated and request.user.is_superuser %}
                        <a class="sidebar-link {% if request.resolver_match.url_name == 'userdetails' or request.resolver_match.url_name == 'user_detail' %}active{% endif %}" href="{% url 'members:userdetails' %}">User details</a>
                    {% endif %}
                    <a class="sidebar-link {% if request.resolver_match.url_name == 'register' %}active{% endif %}" href="{% url 'members:register' %}">Register user</a>
                </nav>
            </aside>

            <main class="app-main">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const appShell = document.getElementById("app-shell");
        const sidebarToggle = document.getElementById("sidebar-toggle");

        sidebarToggle.addEventListener("click", () => {
            const isCollapsed = appShell.classList.toggle("sidebar-collapsed");
            sidebarToggle.setAttribute("aria-expanded", String(!isCollapsed));
        });
    </script>
</body>
</html>
